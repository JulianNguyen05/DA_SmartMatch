spring:
  profiles:
    active: dev
  application:
    name: worklify-api

  datasource:
    # Chạy trên IDE gọi vào MySQL Docker qua cổng 3307
    url: jdbc:mysql://localhost:3307/worklify_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: worklify
    password: worklify_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Để none vì chúng ta đã dùng file init.sql để tạo bảng từ đầu
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  # ĐÃ XÓA CẤU HÌNH RABBITMQ VÌ KHÔNG CÒN DÙNG AI NỮA

  security:
    jwt:
      secret: c21hcnRtYXRjaC1zdXBlci1zZWNyZXQta2V5LTIwMjYtbWluaW11bS0yNTYtYml0cyE=
      expiration: 86400000
      refresh-expiration: 604800000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: always
  tomcat:
    # Giới hạn ở tầng connector Tomcat, kiểm tra TRƯỚC spring.servlet.multipart.
    # Mặc định chỉ 2MB — nếu không tăng, file lớn hơn sẽ bị Tomcat reset kết nối
    # (ERR_CONNECTION_RESET) thay vì trả về lỗi 500 rõ ràng.
    max-http-form-post-size: 10MB
    # Cho phép Tomcat "nuốt" hết phần body dư khi trả lỗi, tránh đóng kết nối đột ngột
    max-swallow-size: 10MB

logging:
  level:
    com.worklify: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    persist-authorization: true
    path: /swagger-ui.html       # Đường dẫn truy cập UI
    tags-sorter: alpha           # BẮT BUỘC: Sắp xếp các Tag (1, 2, 3...) theo thứ tự A-Z
    operations-sorter: method    # Sắp xếp các API trong 1 Tag theo thứ tự: DELETE, GET, POST, PUT
    doc-expansion: none          # Thu gọn tất cả các API khi mới tải trang (giúp trang không bị rối mắt)
    filter: true                 # Bật thanh Search để tìm kiếm API nhanh chóng
    display-request-duration: true # Hiển thị thời gian phản hồi (ms) khi test API
    syntax-highlight:
      theme: agate               # Đổi theme highlight cho các JSON response trông "ngầu" hơn