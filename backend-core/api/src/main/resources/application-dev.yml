spring:
  datasource:
    url: jdbc:mysql://localhost:3307/worklify_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: worklify
    password: worklify_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Chạy trên IDE gọi vào RabbitMQ Docker qua cổng map ra ngoài (giống cách datasource ở trên gọi MySQL qua 3307)
  rabbitmq:
    host: localhost
    port: 5672
    username: worklify
    password: worklify_password

logging:
  level:
    com.worklify: DEBUG
    org.hibernate.SQL: DEBUG
